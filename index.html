<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <title>Wiktor i Elżbieta — Kotor 2025</title>
  <style>
    :root{--cream:#efe2c7;--gold:#dc9d4d;--muted:#a99980;--black:#070503}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--black);color:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit}.portrait{display:none;position:fixed;inset:0;z-index:99;place-items:center;padding:30px;text-align:center;background:radial-gradient(circle at 50% 45%,#322313,#070503 66%)}.portrait div{max-width:370px}.phone{display:block;width:44px;height:72px;margin:0 auto 25px;border:3px solid var(--cream);border-radius:8px;animation:turn 2.3s ease-in-out infinite}.portrait h1{margin:0 0 8px;font:400 clamp(34px,9vw,54px)/1 Georgia,serif}.portrait p{color:var(--muted);line-height:1.5}@media(orientation:portrait){.portrait{display:grid}.app{display:none}}
    .app,.start,.show{width:100%;height:100%}.start{position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#3c2b19,#15100a 40%,#050403 80%)}.start:before,.show:before{content:"";position:absolute;inset:-20%;z-index:-1;opacity:.13;background-image:radial-gradient(circle at 15% 25%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 70% 70%,#fff 0 1px,transparent 1.5px);background-size:71px 89px,103px 97px;animation:dust 10s linear infinite}.beam{position:absolute;top:-30%;left:50%;width:72vw;height:145%;opacity:.13;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);background:linear-gradient(#ffe6ad,#ffd799 55%,transparent);filter:blur(18px);transform:translateX(-50%)}.intro{position:relative;z-index:2;text-align:center}.small{margin:0 0 16px;color:var(--gold);font-size:clamp(8px,1.2vw,12px);letter-spacing:.3em;text-transform:uppercase}.intro h1{display:flex;align-items:center;gap:clamp(14px,3vw,34px);margin:0;font:400 clamp(38px,7vw,92px)/.96 Georgia,serif;text-shadow:0 5px 38px #000}.intro h1 i{color:var(--gold);font-size:.58em}.place{margin:15px 0 28px;color:var(--muted);font:italic clamp(15px,2vw,23px) Georgia,serif;letter-spacing:.12em}.start button{display:inline-flex;align-items:center;gap:11px;min-height:50px;padding:0 27px;border:1px solid #efc17b80;border-radius:99px;color:#1c1005;background:linear-gradient(#f3c57d,#c68031);box-shadow:0 0 0 6px #d28d3c15,0 13px 35px #0008;font-weight:800;cursor:pointer}.start button:active{transform:translateY(1px)}.lamp{width:10px;height:10px;border-radius:50%;background:#442306}.note{margin:12px 0 0;color:#746754;font-size:11px}
    .show{position:relative;display:none;place-items:center;overflow:hidden;background:radial-gradient(ellipse at center,#282013,#070503 68%)}.show.on{display:grid}.card{position:relative;z-index:5;width:min(84vw,1080px);padding:6vh 7vw;text-align:center}.card:before,.card:after{content:"";display:block;width:min(190px,24vw);height:1px;margin:0 auto 5vh;background:linear-gradient(90deg,transparent,#dfa654,transparent)}.card:after{margin:5vh auto 0}.kicker{margin:0 0 2.6vh;color:var(--gold);font-size:clamp(9px,1.2vw,13px);letter-spacing:.3em;text-transform:uppercase}.title{margin:0;font:400 clamp(36px,6.2vw,92px)/1.02 Georgia,serif;text-shadow:0 5px 35px #000}.body{margin:3vh auto 0;color:#b6a78e;font:italic clamp(15px,2vw,24px)/1.45 Georgia,serif}.top{position:absolute;top:max(15px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));z-index:30;display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.2em}.brand{font-weight:900}.brand span{color:var(--gold)}.album{padding:7px 12px;border:1px solid #e6b36b55;border-radius:99px;color:#edcf9c;background:#160f0877;text-decoration:none;letter-spacing:.07em}.progress{position:absolute;left:0;bottom:0;z-index:35;width:0;height:3px;background:linear-gradient(90deg,#8f5723,#efbb72);box-shadow:0 0 9px #df994e99}.grain,.vignette,.flash,.shutter{position:absolute;inset:0;pointer-events:none}.grain{z-index:15;opacity:.11;mix-blend-mode:overlay;background-image:repeating-radial-gradient(circle at 20% 30%,transparent 0,#fff .6px,transparent 1.2px,transparent 4px);background-size:7px 7px;animation:grain .16s steps(2) infinite}.vignette{z-index:16;box-shadow:inset 0 0 19vw 6vw #000c,inset 0 0 3vw #000}.flash{z-index:22;opacity:0;background:#fff3cf;mix-blend-mode:screen}.shutter{z-index:21;height:50%;background:#020201;transform:scaleY(0)}.bottom{top:auto;transform-origin:bottom}.topshut{bottom:auto;transform-origin:top}.changing .flash{animation:flash .72s ease-out}.changing .shutter{animation:shutter .7s ease-in-out}.skip{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));z-index:31;transform:translateX(-50%);padding:8px 14px;border:1px solid #e4bb7c33;border-radius:99px;color:#b8a78d;background:#100b07aa;text-decoration:none;font-size:10px;letter-spacing:.08em}.muter{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:32;width:35px;height:35px;border:1px solid #e4bb7c33;border-radius:50%;color:#e7c58f;background:#100b07aa;cursor:pointer}.muter.off{color:#655a49;text-decoration:line-through}
    @media(max-height:520px){.intro h1{font-size:clamp(34px,8.4vw,67px)}.place{margin:8px 0 14px}.start button{min-height:44px}.note{display:none}.card{padding-block:4vh}.card:before{margin-bottom:3vh}.card:after{margin-top:3vh}.body{margin-top:2vh}}
    @keyframes turn{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(90deg)}}@keyframes dust{to{background-position:80px -50px,-60px 70px}}@keyframes grain{25%{transform:translate(1%,-1%)}50%{transform:translate(-1%,1%)}75%{transform:translate(1%,1%)}100%{transform:translate(-1%,-1%)}}@keyframes flash{0%{opacity:0}19%{opacity:.9}31%{opacity:.16}47%{opacity:.46}100%{opacity:0}}@keyframes shutter{0%,100%{transform:scaleY(0)}38%,54%{transform:scaleY(1.03)}}
  </style>
</head>
<body>
  <section class="portrait"><div><span class="phone"></span><p class="small">POKAZ SLAJDÓW</p><h1>Obróć telefon</h1><p>Ta historia została przygotowana wyłącznie do oglądania poziomo.</p></div></section>
  <main class="app">
    <section class="start" id="start"><div class="beam"></div><div class="intro"><p class="small">PRYWATNY POKAZ · WRZESIEŃ 2025</p><h1><span>Wiktor</span><i>&amp;</i><span>Elżbieta</span></h1><p class="place">Kotor · Czarnogóra</p><button id="startBtn"><span class="lamp"></span>Uruchom projektor</button><p class="note">Muzyka i dźwięk włączą się po dotknięciu</p></div></section>
    <section class="show" id="show">
      <header class="top"><div class="brand">KOTOR <span>25</span></div><a class="album" href="https://quickshare.samsungcloud.com/xvFxekxcS1PQ">Otwórz album ↗</a></header>
      <article class="card"><p class="kicker" id="kicker"></p><h2 class="title" id="title"></h2><p class="body" id="body"></p></article>
      <div class="grain"></div><div class="vignette"></div><div class="flash"></div><div class="shutter topshut"></div><div class="shutter bottom"></div>
      <a class="skip" href="https://quickshare.samsungcloud.com/xvFxekxcS1PQ">Pomiń intro i otwórz album</a><button class="muter" id="muter" aria-label="Wycisz">♫</button><div class="progress" id="progress"></div>
    </section>
  </main>
  <script>
    const ALBUM='https://quickshare.samsungcloud.com/xvFxekxcS1PQ';
    const slides=[
      ['WRZESIEŃ 2025','Pewnego września…','zaczęła się mała podróż na południe.',4300],
      ['WIKTOR I ELŻBIETA','Tam, gdzie góry schodzą do morza','i każda droga prowadzi nad Zatokę Kotorską.',4700],
      ['CZARNOGÓRA','Kotor, 2025','Kilka dni, do których warto wrócić.',4400],
      ['KLIK…','Zapalmy projektor','Za moment otworzy się nasz album.',3000]
    ];
    const start=document.querySelector('#start'),show=document.querySelector('#show'),kicker=document.querySelector('#kicker'),title=document.querySelector('#title'),body=document.querySelector('#body'),progress=document.querySelector('#progress'),muter=document.querySelector('#muter');
    let ctx,master,timer,step=0,nextTime=0,muted=false,index=0,total=slides.reduce((n,s)=>n+s[3],0),elapsed=0;
    function audio(){if(ctx)return ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC;master=ctx.createGain();master.gain.value=.0001;master.connect(ctx.destination);return ctx}
    function pluck(f,t,v=.08){const o=ctx.createOscillator(),s=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type='triangle';s.type='sine';o.frequency.value=f;s.frequency.value=f*2.005;filter.type='lowpass';filter.frequency.setValueAtTime(2500,t);filter.frequency.exponentialRampToValueAtTime(650,t+.42);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.48);o.connect(filter);s.connect(filter);filter.connect(g).connect(master);o.start(t);s.start(t);o.stop(t+.5);s.stop(t+.5)}
    function drum(t,big){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(big?118:88,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(big?.17:.095,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(master);o.start(t);o.stop(t+.18)}
    function schedule(){const m=[293.66,349.23,392,440,466.16,554.37,523.25,440,392,349.23,293.66,349.23,392,440,349.23,277.18];while(nextTime<ctx.currentTime+.2){pluck(m[step%m.length],nextTime,step%4===0?.1:.07);if(step%2===0)pluck(146.83,nextTime,.043);if(step%4===0)drum(nextTime,step%8===0);step++;nextTime+=60/108/2}timer=setTimeout(schedule,60)}
    function clickSound(){if(!ctx||muted)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(48,t+.08);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.11)}
    function music(){if(!audio())return;ctx.resume();nextTime=ctx.currentTime+.08;schedule();master.gain.exponentialRampToValueAtTime(.7,ctx.currentTime+1.3)}
    function render(){const s=slides[index];kicker.textContent=s[0];title.textContent=s[1];body.textContent=s[2];progress.style.transition=`width ${s[3]}ms linear`;requestAnimationFrame(()=>progress.style.width=((elapsed+s[3])/total*100)+'%');timer=setTimeout(()=>{elapsed+=s[3];if(index===slides.length-1){location.assign(ALBUM);return}show.classList.add('changing');clickSound();setTimeout(()=>{index++;render()},275);setTimeout(()=>show.classList.remove('changing'),760)},s[3])}
    document.querySelector('#startBtn').onclick=async()=>{music();clickSound();try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}try{await screen.orientation.lock('landscape')}catch{}start.style.display='none';show.classList.add('on');render()};
    muter.onclick=()=>{muted=!muted;muter.classList.toggle('off',muted);if(master)master.gain.setTargetAtTime(muted?.0001:.7,ctx.currentTime,.08)};
  </script>
</body>
</html>
